[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "floatbeat"
version = "0.1.0"
description = "A tiny floating DJ for the Linux desktop that reacts to system audio."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Raúl Arroyo Cañadas" }]
keywords = ["linux", "desktop", "widget", "mpris", "audio", "visualizer", "pyside6"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = ["PySide6>=6.9,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
floatbeat = "floatbeat.__main__:main"

[project.urls]
Homepage = "https://github.com/rarroy2/floatbeat"
Issues = "https://github.com/rarroy2/floatbeat/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/floatbeat"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
